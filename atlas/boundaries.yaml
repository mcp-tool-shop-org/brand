summary: ""
boundaries:
  - name: .claude
    globs:
      - .claude/**
    role: docs
  - name: .githooks
    globs:
      - .githooks/**
    role: config
  - name: .github
    globs:
      - .github/**
    role: config
  - name: assets
    globs:
      - assets/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: logos
    globs:
      - logos/**
    role: config
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: site
    globs:
      - site/**
    role: site
  - name: src
    globs:
      - src/**
    role: code
  - name: tests
    globs:
      - tests/**
    role: test
