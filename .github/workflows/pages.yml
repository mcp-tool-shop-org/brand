name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    # The published site is NOT a pure function of site/. Its build reads the
    # repo root: model-views.mjs imports the compiled schema from dist/ (built
    # from src/), discovers viewer pages by walking logos/<slug>/model/, and the
    # passthrough integration cross-checks its output against manifest.json.
    # Gating on 'site/**' alone means adding a model view.json under logos/
    # changes what the site should publish while triggering no deploy — the
    # live site silently stays a version behind, with nothing red to notice.
    paths:
      - 'site/**'
      - 'src/**'
      - 'logos/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  # PR-gated build (no deploy) so a build-breaking site edit or a /site
  # Dependabot bump fails CI on the PR instead of only surfacing post-merge
  # during the live Pages deploy. The deploy job + Pages-specific steps are
  # gated to non-PR events below.
  pull_request:
    # Same list as the push trigger, for the same reason: a PR touching only
    # src/ or logos/ can still break or change this build.
    paths:
      - 'site/**'
      - 'src/**'
      - 'logos/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          # Both lockfiles: this job installs the root package as well as the
          # site (see "Build root package" below).
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - name: Install root dependencies
        # Root install is deterministic (`npm ci`) — unlike the site install
        # below, nothing here trips the rollup optional-deps bug.
        run: npm ci

      - name: Build root package
        # site/src/lib/model-views.mjs imports parseModelView from
        # ../../../dist/model-view.js — deliberately one schema implementation
        # shared by the ingest gate and the viewer, so the site can never render
        # a view that `add-model` would have refused. dist/ is gitignored, so on
        # a clean runner it does not exist until tsc runs and the Astro build
        # dies with "Could not resolve ../../../dist/model-view.js". It built
        # locally only because dist/ was left over from an earlier build — which
        # is exactly why this step is the workflow's job and not the author's.
        run: npm run build

      - name: Install site dependencies
        working-directory: site
        # `npm ci` would be ideal for determinism, but the npm cross-platform
        # optional-deps bug (npm/cli#4828) means a lockfile generated on one
        # platform may omit the rollup native binary for another. The
        # documented workaround is to remove BOTH package-lock.json AND
        # node_modules and re-resolve from package.json. Versions still pin
        # via package.json caret ranges, which for this site are policy-
        # documented in site/DEPS.md.
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
