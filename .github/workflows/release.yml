name: Release

# Publishes @mcptoolshop/brand to npm via OIDC trusted publishing (NO token) and
# creates the GitHub Release. The npm Trusted Publisher is bound to THIS file
# name (release.yml) — do not rename it or the binding breaks. Supersedes the
# token-based publish.yml (retired 2026-06-20).
#
# Compensators (org workflow standard NAMED_COMPENSATORS — both steps below
# are irreversible tool calls; this table is mandatory and not skippable):
#
#   Action: npm publish --provenance --access public
#   Undo:   Within npm's ~72-hour post-publish window, AND only while nothing
#           else depends on this version yet:
#             npm unpublish @mcptoolshop/brand@<version>
#           Outside that window — the realistic case, since a bad release is
#           rarely caught same-day — npm's registry deliberately disallows
#           removing a version others may already depend on. The real remedy:
#             npm deprecate @mcptoolshop/brand@<version> "<reason> -- use <next-version> instead"
#           Post-rollback state: the tarball still exists and prior installs
#           keep resolving it, but `npm install`/`npm add` surface the
#           deprecation warning and stop being offered it as latest. No
#           command undoes an install someone already made of the bad version.
#           Owner: mcp-tool-shop (npm account holder + GitHub org owner).
#
#   Action: gh release create <tag> ... --verify-tag
#   Undo:   Preferred — keep the tag and the Release object (the npm
#           provenance attestation is bound to that exact tag/commit, so
#           deleting the tag breaks after-the-fact provenance verification for
#           whatever already published against it) and mark it instead:
#             gh release edit <tag> --notes "Superseded by vX.Y.Z -- do not use"
#           If the Release object itself truly must go:
#             gh release delete <tag> --yes
#           Only add `--cleanup-tag` to that if the git tag itself should also
#           go — that's what breaks provenance verification above, so avoid it
#           unless the tag was created by mistake and nothing was published
#           against it yet.
#           Post-rollback state: `gh release edit` leaves the tag, the
#           Release, and npm provenance verification all intact with the
#           notes now warning users off; `gh release delete` removes the
#           Release object (and the tag too, if --cleanup-tag was added) from
#           the Releases page, but does not touch the npm package itself.
#           Owner: mcp-tool-shop (GitHub org owner).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.5) — must already be pushed'
        required: true

permissions:
  contents: write   # for GitHub Release creation
  id-token: write   # for npm provenance + OIDC trusted-publishing auth

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm >=11.5 in a sandbox for OIDC trusted-publishing auth
        run: |
          # Node 22 ships npm 10.9, which signs provenance but cannot negotiate
          # the OIDC auth path (PUT returns a misleading 404). An in-place
          # `npm i -g npm@latest` races the bundled arborist and breaks — install
          # npm@latest into a sandbox dir and shadow the system npm via PATH.
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@latest
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          echo "Tag: ${{ steps.tag.outputs.tag }} -> ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci

      - name: Verify (typecheck + build + test)
        run: |
          npm run typecheck
          npm test

      - name: npm pack dry-run (shape check)
        run: npm pack --dry-run

      - name: Publish to npm with provenance (OIDC trusted publisher, no token)
        run: npm publish --provenance --access public

      - name: Extract CHANGELOG section for the release notes
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ ("^## " ver "( |$)") {flag=1; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$TAG" --title "brand $TAG" --notes-file release-notes.md --verify-tag
          else
            gh release create "$TAG" --title "brand $TAG" --generate-notes --verify-tag
          fi
