name: CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'logos/**'
      - 'manifest.json'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      # .gitattributes governs how logos/** are checked out (eol translation,
      # binary marking, LFS filters) and `brand verify` hashes exactly those
      # bytes. See the file's own logos/**/*.svg rule: it exists because
      # core.autocrlf=true would otherwise rewrite a tracked asset's line
      # endings, change its SHA-256, and fail verify on a clean, untampered
      # clone. A change here can break verify for every consumer while
      # touching no other path in this list.
      - '.gitattributes'
      # Three paths this workflow executes or reads that nothing above matches:
      # the audit gate's script, its allowlist data (note '.github/workflows/**'
      # does NOT cover '.github/audit-allowlist.json'), and the vitest config
      # holding the coverage thresholds the Node 22 leg enforces. Without these,
      # editing what CI *does* triggers nothing — so the commit that weakens or
      # breaks a gate is precisely the commit that never runs it. Waiving an
      # advisory in the allowlist is the sharp case: its whole purpose is to
      # change a red build to green, and it could do so unobserved.
      #
      # .githooks/** is deliberately NOT here. CI does not run git hooks, so a
      # change there cannot alter any result on this runner; gating on it would
      # spend minutes for no signal.
      - 'scripts/**'
      - '.github/audit-allowlist.json'
      - 'vitest.config.ts'
      # Codecov reads its status and comment settings from this file.
      - 'codecov.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'logos/**'
      - 'manifest.json'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
      # Same reasoning as the push trigger above.
      - '.gitattributes'
      - 'scripts/**'
      - '.github/audit-allowlist.json'
      - 'vitest.config.ts'
      # Codecov reads its status and comment settings from this file.
      - 'codecov.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.node-version == 22 && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Atlas requires Node 22 or later, so the check runs on the 22 cell only.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
      - run: npm ci
      - name: npm audit (high)
        id: audit
        # Bare `npm audit --audit-level=high` has no escape hatch: the instant
        # any dependency (incl. a transitive one entirely outside this repo's
        # control) gets a new high/critical advisory published upstream, every
        # PR on every Node version goes red with no way to unblock unrelated
        # work while a real fix is prepared — this happened for real
        # (brace-expansion + postcss), fixed only by a manual dependency bump
        # under time pressure. Reviewed, time-boxed exceptions now live in
        # .github/audit-allowlist.json (empty by default — nothing is waived
        # today) and are enforced by scripts/check-audit-allowlist.mjs; see
        # either file's header for the full add-an-exception procedure. Any
        # advisory not listed there, or listed but past its expiry, still
        # fails the build exactly like bare `npm audit` did before.
        run: |
          set +e
          npm audit --audit-level=high --json > audit-report.json
          AUDIT_EXIT=$?
          set -e
          node scripts/check-audit-allowlist.mjs audit-report.json .github/audit-allowlist.json "$AUDIT_EXIT"
        continue-on-error: false
      - run: npm run typecheck
      - run: npm run build
      - name: Test (with coverage)
        id: tests
        # Only one matrix leg pays the coverage-instrumentation cost, not all
        # three — CI minutes matter. Node 22 is this repo's baseline version
        # (matches the other single-Node jobs below and release.yml).
        if: matrix.node-version == 22
        run: npm run test:ci -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Test
        if: matrix.node-version != 22
        run: npm test
      - name: Write CI summary
        if: always()
        run: |
          {
            echo "## CI summary (node ${{ matrix.node-version }})"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| npm audit (high) | ${{ steps.audit.outcome }} |"
            echo "| typecheck / build / test | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: lint-test-build
    if: ${{ !cancelled() && needs.lint-test-build.result != 'cancelled' && needs.lint-test-build.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.lint-test-build.result == 'success' || hashFiles('coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/lcov.info
      - name: Upload test results to Codecov
        if: ${{ needs.lint-test-build.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify manifest integrity
        id: verify
        run: node dist/cli.js manifest --check --logos logos --output manifest.json
      - name: Write integrity summary
        if: always()
        run: |
          {
            echo "## Manifest integrity"
            echo ""
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "Manifest hashes match every file in \`logos/\`."
            else
              echo "Manifest verification FAILED — \`logos/\` and \`manifest.json\` are out of sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
